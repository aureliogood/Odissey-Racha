# =============================================================
#  OdisseyRacha - amigos y rachas (estilo "racha de TikTok")
# =============================================================
#
#  Como funciona:
#   - Con /racha (o /amigos) se abre el menu.
#   - Envias una solicitud de amistad; si la aceptan, ya sois amigos.
#   - Con un amigo puedes "Solicitar racha". Si la acepta, se crea la racha.
#   - La racha se mantiene SOLO si los DOS entran al servidor el mismo dia.
#     Si un dia entra uno pero el otro no, la racha se pierde.
#   - Cada dia que ambos entran, la racha sube 1. En ciertos dias da recompensas.

# Version del config (informativo; las claves nuevas usan valores por defecto).
config-version: 2

# Zona horaria con la que se decide cuando cambia el dia (y cuando se rompe la
# racha). Ejemplos: "America/Mexico_City", "America/Bogota", "Europe/Madrid".
# Vacio = se usa la zona del servidor.
zona-horaria: ""

# Maximo de amigos por jugador.
max-amigos: 20

# Maximo de rachas activas por jugador (0 = sin limite).
max-rachas: 3

# Maximo de miembros por racha (2 = solo parejas; 3+ = rachas de grupo).
max-miembros-racha: 6

# Avisar por chat a los dos cuando la racha se alimenta o se pierde.
avisar-al-perder: true
avisar-al-subir: true

# Al entrar, avisar si una racha sigue viva pero el otro aun no ha entrado hoy.
avisar-al-entrar: true

# Impide crear/ampliar rachas entre jugadores que comparten la misma IP
# (evita multicuenta para farmear rachas). Se basa en la ultima IP registrada.
anti-multicuenta: true

# =============================================================
#  HOLOGRAMA DEL TOP
# =============================================================
# Placeholders para un holograma con las mayores rachas (PlaceholderAPI):
#   %odisseyracha_top%              -> TODAS las lineas de golpe (usa saltos de linea)
#   %odisseyracha_top_<n>%          -> una linea (n = posicion, 1 = mejor)
#   %odisseyracha_top_<n>_nombres%  -> solo los nombres
#   %odisseyracha_top_<n>_dias%     -> solo los dias
#   %odisseyracha_top_<n>_pos%      -> el numero de posicion
#   %odisseyracha_top_<n>_miembros% -> cuantos miembros
# En "formato" usa %pos%, %nombres%, %dias% y %miembros%.
holograma:
  cantidad: 10
  formato: "&e%pos%. &f%nombres% &7- &e%dias% &7dias"
  vacio: "&7Todavia no hay rachas."

# =============================================================
#  RECOMPENSAS
# =============================================================
# Por cada dia de racha que alcancen LOS DOS, se ejecuta lo que pongas aqui.
# La clave es el numero de dias. Todos los premios van para los dos jugadores.
#
#   efectos  -> "TIPO:NIVEL:DURACION_SEGUNDOS"  (ej: SPEED:1:300 = Velocidad I 5 min)
#   objetos  -> "MATERIAL:CANTIDAD"             (ej: DIAMOND:3)
#   comandos -> comandos de consola. Placeholders: %player%, %jugador%, %amigo%, %dias%
#
recompensas:
  3:
    efectos:
      - "SPEED:1:300"
    objetos:
      - "DIAMOND:3"
    comandos:
      - "say %jugador% y %amigo% llevan %dias% dias de racha!"
  7:
    efectos:
      - "REGENERATION:1:600"
    objetos:
      - "DIAMOND:10"
      - "GOLDEN_APPLE:2"
    comandos:
      - "say %jugador% y %amigo% llevan %dias% dias de racha!"
  30:
    efectos:
      - "HASTE:2:900"
    objetos:
      - "NETHERITE_INGOT:1"
    comandos:
      - "say %jugador% y %amigo% han llegado a %dias% dias de racha!"

# =============================================================
#  RECUPERACION DE RACHA (estilo TikTok)
# =============================================================
# Cuando una racha se pierde, no muere del todo: queda "recuperable" durante
# unas horas. Si uno de los dos pulsa "Recuperar" en el menu de la racha, se
# le devuelven los dias. Cada jugador puede recuperar un numero limitado de
# veces por racha: empieza en "base" y sube con los dias, hasta "maximo".
recuperaciones:
  activado: true
  base: 3              # recuperaciones al empezar la racha
  maximo: 6            # tope de recuperaciones
  por-dias: 10         # +1 recuperacion cada X dias de racha
  horas: 48            # horas para recuperarla (0 = sin limite)

# =============================================================
#  EFECTOS DEL MENU DE RACHA
# =============================================================
# Al clicar la cabeza de una racha se abre un menu con estos efectos.
#   dias-minimos -> dias de racha necesarios para poder usarlo (0 = siempre)
#   cooldown     -> segundos de espera entre usos de ESE efecto (0 = sin limite)
#   efecto       -> "TIPO:NIVEL:DURACION_SEGUNDOS" (ej: SPEED:1:300)
#   material     -> icono del item en el menu
efectos-racha:
  velocidad:
    nombre: "&b&lVelocidad"
    material: "SUGAR"
    dias-minimos: 0
    cooldown: 300
    efecto: "SPEED:1:300"
    lore:
      - "&7Velocidad I durante 5 minutos"
  fuerza:
    nombre: "&c&lFuerza"
    material: "BLAZE_POWDER"
    dias-minimos: 3
    cooldown: 300
    efecto: "INCREASE_DAMAGE:1:300"
    lore:
      - "&7Fuerza I durante 5 minutos"
  regeneracion:
    nombre: "&d&lRegeneracion"
    material: "GHAST_TEAR"
    dias-minimos: 7
    cooldown: 600
    efecto: "REGENERATION:1:180"
    lore:
      - "&7Regeneracion I durante 3 minutos"
  prisa:
    nombre: "&e&lPrisa"
    material: "GOLDEN_PICKAXE"
    dias-minimos: 15
    cooldown: 300
    efecto: "HASTE:2:300"
    lore:
      - "&7Prisa II durante 5 minutos"

# La mascota se configura en mascota.yml.

# =============================================================
#  BASE DE DATOS
# =============================================================
# tipo: yaml   -> guarda en plugins/OdisseyRacha/datos.yml (por defecto)
#       mysql  -> MySQL/MariaDB
#       sqlite -> archivo local plugins/OdisseyRacha/racha.db
storage:
  tipo: yaml
  prefijo: odisseyracha_
  mysql:
    host: localhost
    port: 3306
    database: odisseyracha
    user: root
    password: ""

# =============================================================
#  MULTIPLICADOR DE RACHA
# =============================================================
# Multiplica la recompensa diaria segun los dias de racha. Coge el tramo mas
# alto cuyo "dias" sea menor o igual que los dias actuales de la racha.
multiplicador:
  activado: true
  tramos:
    - dias: 0
      multiplicador: 1.0
    - dias: 7
      multiplicador: 1.5
    - dias: 30
      multiplicador: 2.0
    - dias: 100
      multiplicador: 3.0

# =============================================================
#  ECONOMIA (necesita Vault)
# =============================================================
# Cada dia que la racha sube, se da esta cantidad de dinero a los DOS jugadores,
# multiplicada por el multiplicador de arriba. Pon 0 para desactivarlo.
economia:
  activado: true
  recompensa-diaria: 100.0

# =============================================================
#  DISCORD (webhook)
# =============================================================
# Pega aqui la URL del webhook de tu canal. Vacio = desactivado.
# Placeholders: %jugador%, %amigo%, %dias%, %multiplicador%, %estado%
discord:
  webhook: ""
  al-subir: true
  al-perder: true
  mensaje-subida: "🔥 %jugador% y %amigo% llevan %dias% dias de racha!"
  mensaje-perdida: "💔 %jugador% y %amigo% han perdido su racha de %dias% dias (%estado%)."

# =============================================================
#  SONIDOS
# =============================================================
# Formato de cada sonido: "namespace:clave" o "namespace:clave;volumen;pitch".
# Volumen y pitch son opcionales (0.0 - 1.0 / 0.5 - 2.0 aprox.).
sonidos:
  activado: true
  abrir: "ui.button.click;0.6;1.2"
  cerrar: "ui.button.click;0.5;0.9"
  seleccionar: "ui.button.click;0.5;1.0"
  volver: "ui.button.click;0.5;0.8"
  exito: "entity.player.levelup;0.6;1.2"
  error: "entity.villager.no;0.7;1.0"
  aviso: "block.note_block.bell;0.6;1.4"
  recuperar: "entity.player.levelup;0.8;1.4"
  efecto: "entity.illusioner.cast_spell;0.7;1.2"
  hito: "ui.toast.challenge_complete;0.8;1.0"
  mascota: "entity.allay.ambient_with_item;0.7;1.3"

